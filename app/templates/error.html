{% extends "base.html" %}
{% block title %}Something went wrong{% endblock %}
{% block content %}
<h1>{{ 'Page not found' if status_code == 404 else 'Something went wrong' }}</h1>
<p>{{ detail if status_code in (403, 404) else 'Please go back and try again.' }}</p>
<p><a class="btn btn-primary" href="/">Go to CareCircle</a></p>
{% endblock %}
