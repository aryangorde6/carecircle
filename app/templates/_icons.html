{# Small drawn icons, one stroke weight, coloured by currentColor. #}
{% macro face(kind, cls="face") -%}
<svg class="{{ cls }}" viewBox="0 0 32 32" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
  <circle cx="16" cy="16" r="13"/><circle cx="11.5" cy="13" r="0.6" fill="currentColor"/><circle cx="20.5" cy="13" r="0.6" fill="currentColor"/>
  {%- if kind == 'good' %}<path d="M10 19.5c3.3 3.6 8.7 3.6 12 0"/>{% elif kind == 'okay' %}<path d="M10.5 20.5h11"/>{% else %}<path d="M10 23c3.3-3.6 8.7-3.6 12 0"/>{% endif -%}
</svg>
{%- endmacro %}
{% macro speaker() -%}
<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 0 1 0 6M18 6.5a7.8 7.8 0 0 1 0 11"/></svg>
{%- endmacro %}
{% macro mic() -%}
<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
{%- endmacro %}
{% macro mark() -%}
<svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="16" r="13.5" stroke-width="2.2"/><circle cx="16" cy="16" r="9.5" stroke-width="1.2" stroke-dasharray="2 2.2"/><path d="M11.2 16.4l3.3 3.3 6.4-7.2" stroke-width="2.6"/></svg>
{%- endmacro %}
