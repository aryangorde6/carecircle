[project]
name = "carecircle"
version = "1.0.0"
description = "CareCircle: an elder-centred medication and appointment platform for elders, caretakers and family."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.18",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "google-cloud-firestore>=2.19",
    "google-genai>=1.0",
    "google-auth>=2.35",
    "requests>=2.32",
    "email-validator>=2.2",
    "segno>=1.6.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "pip-audit>=2.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "C4", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.coverage.run]
omit = ["app/store_firestore.py", "app/services/gemini_client.py"]
